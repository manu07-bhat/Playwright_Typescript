<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TestID Practice Page</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background-color: #f4f4f4;
    }
    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 15px;
      width: 300px;
    }
    button {
      margin-top: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2 data-testid="page-title">Playwright TestID Practice</h2>

  <div class="box">
    <label>Username</label>
    <input data-testid="username-input" type="text" placeholder="Enter username">
  </div>

  <div class="box">
    <label>Password</label>
    <input data-testid="password-input" type="password" placeholder="Enter password">
  </div>

  <div class="box">
    <button data-testid="login-button">Login</button>
  </div>

  <div class="box">
    <p data-testid="message">Status: Not logged in</p>
  </div>

  <script>
    const loginBtn = document.querySelector('[data-testid="login-button"]');
    const message = document.querySelector('[data-testid="message"]');

    loginBtn.addEventListener('click', () => {
      message.innerText = "Status: Logged in ✅";
    });
  </script>

</body>
</html>
